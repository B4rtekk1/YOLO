[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yolov11-custom"
version = "11.0.0"
description = "Custom YOLOv11 PyTorch implementation for detection, segmentation, and pose."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "torch>=2.0.0",
  "torchvision>=0.15.0",
  "numpy>=1.24.0",
  "opencv-python>=4.8.0",
  "matplotlib>=3.7.0",
  "pillow>=10.0.0",
  "pyyaml>=6.0",
  "tqdm>=4.65.0",
  "pycocotools>=2.0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["yolov11*"]
